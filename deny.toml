# cargo-deny: only permissive licenses may enter the dependency tree.
# Run: cargo deny check licenses
[graph]
all-features = false

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
