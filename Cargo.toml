[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jan Bláha <j3corre@gmail.com>"]
repository = "https://github.com/j3corre/pabaru"
homepage = "https://pabaru.kitai.cz"
rust-version = "1.88"
keywords = ["backup", "paper", "reed-solomon", "archival", "offline"]
categories = ["command-line-utilities", "encoding"]

[workspace.dependencies]
pabaru-format = { path = "crates/pabaru-format" }
pabaru-ecc = { path = "crates/pabaru-ecc" }
pabaru-archive = { path = "crates/pabaru-archive" }
pabaru-crypto = { path = "crates/pabaru-crypto" }
pabaru-layout = { path = "crates/pabaru-layout" }
pabaru-render = { path = "crates/pabaru-render" }
pabaru-scan = { path = "crates/pabaru-scan" }
pabaru-core = { path = "crates/pabaru-core" }
thiserror = "2"
# Pinned: the outer code must stay bit-exact with docs/SPEC.md (rate selection included).
reed-solomon-simd = "=3.1.0"
crc32c = "0.6"
zstd = "0.13"
tar = "0.4"
walkdir = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
proptest = "1"
png = "0.17"
flate2 = "1"
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
tempfile = "3"

# Tests work with images – without optimizations they would be needlessly slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
